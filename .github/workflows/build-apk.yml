name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & build web bundle
        working-directory: apps/web
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Sync Capacitor Android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK with clean filename
        run: cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk piano-waterfall.apk

      - name: Upload Piano Waterfall APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piano-waterfall-debug-apk
          path: piano-waterfall.apk

      - name: Publish direct-download APK to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Piano Waterfall (Latest APK)
          body: Direct APK download — tap `piano-waterfall.apk` below to install on Android.
          files: piano-waterfall.apk
          make_latest: true
